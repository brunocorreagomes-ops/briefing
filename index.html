<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Briefing · Ryna Hayashi</title>
    <link rel="stylesheet" href="/src/index.css">
    <style>
        /* Tooltip behavior */
        .tooltip-container:hover .tooltip-box,
        .tooltip-container:focus-within .tooltip-box {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }
        .chip.selected {
            background-color: #5A5A40;
            color: white;
            border-color: #5A5A40;
        }
    </style>
</head>
<body class="bg-[#f5f5f0] text-[#1a1a1a] font-sans antialiased min-h-screen pb-20">

    <!-- Header -->
    <header class="pt-12 pb-8 px-6 text-center">
        <div class="max-w-2xl mx-auto">
            <div class="flex items-center justify-center gap-2 mb-4">
                <div class="h-0.5 w-8 bg-[#5A5A40] opacity-30"></div>
                <span class="text-xs uppercase tracking-[0.2em] font-medium text-[#5A5A40]">Processo Criativo</span>
                <div class="h-0.5 w-8 bg-[#5A5A40] opacity-30"></div>
            </div>
            <h1 class="text-5xl md:text-6xl font-serif text-[#1a1a1a] mb-2">Briefing</h1>
            <p class="text-[#1a1a1a]/40 italic font-serif text-xl border-t border-[#1a1a1a]/10 pt-4 inline-block px-12">Ryna Hayashi Psicóloga</p>
        </div>
    </header>

    <!-- Progress Bar -->
    <div class="max-w-4xl mx-auto px-6 mb-12">
        <div class="flex justify-between items-center relative gap-4" id="progress-container">
            <div class="absolute top-1/2 left-0 w-full h-[1px] bg-[#1a1a1a]/10 -z-10 -translate-y-1/2"></div>
            <!-- Progress items generated by JS -->
        </div>
    </div>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-6">
        <form id="briefing-form" class="bg-white p-8 md:p-12 rounded-[40px] shadow-sm border border-[#5A5A40]/5 relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-[#f5f5f0]/50 rounded-bl-[100%] pointer-events-none"></div>
            
            <div id="step-indicator" class="mb-8">
                <span class="text-[10px] text-[#5A5A40] font-bold uppercase tracking-widest block mb-1">Passo <span id="current-step-num">1</span> de 5</span>
                <h2 id="step-title" class="text-3xl font-serif">Título do Passo</h2>
            </div>

            <div id="steps-content">
                <!-- Steps injected via script -->
            </div>

            <div class="mt-12 pt-8 border-t border-[#1a1a1a]/5 flex justify-between items-center">
                <button type="button" id="prev-btn" class="flex items-center gap-2 text-[#1a1a1a]/60 hover:text-[#1a1a1a] transition-colors font-medium px-4 py-2 hidden">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg> Anterior
                </button>
                <div class="flex-1"></div>
                <button type="button" id="next-btn" class="flex items-center gap-2 bg-[#5A5A40] text-white px-8 py-3 rounded-full hover:shadow-xl transition-all duration-300 font-medium tracking-wide">
                    Próximo <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                </button>
                <button type="submit" id="submit-btn" class="hidden items-center gap-2 bg-[#5A5A40] text-white px-10 py-4 rounded-full hover:shadow-xl transition-all duration-300 font-bold tracking-widest uppercase text-sm">
                    Enviar Briefing <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
                </button>
            </div>
        </form>

        <!-- Success Message -->
        <div id="success-screen" class="hidden text-center bg-white p-12 rounded-[40px] shadow-sm border border-[#5A5A40]/10">
            <div class="w-16 h-16 bg-[#5A5A40] text-white rounded-full flex items-center justify-center mx-auto mb-6">
                <svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            </div>
            <h2 class="text-4xl font-serif mb-4">Briefing Enviado</h2>
            <p class="text-[#1a1a1a]/60 mb-8 font-light">
                Obrigada por compartilhar suas informações. Entrarei em contato em breve para darmos os próximos passos no seu projeto.
            </p>
            <button type="button" onclick="location.reload()" class="text-[#5A5A40] font-medium hover:underline flex items-center justify-center mx-auto gap-2">
                Recomeçar
            </button>
        </div>
    </main>

    <footer class="max-w-4xl mx-auto px-6 mt-8 flex flex-col md:flex-row justify-between items-center gap-4 text-[#1a1a1a]/30 text-xs uppercase tracking-widest">
        <span>© 2026 Ryna Hayashi · Psicóloga</span>
        <div class="flex items-center gap-6">
            <a href="#" class="hover:text-[#5A5A40] transition-colors flex items-center gap-1">Instagram</a>
            <a href="#" class="hover:text-[#5A5A40] transition-colors flex items-center gap-1">Contato</a>
        </div>
    </footer>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
